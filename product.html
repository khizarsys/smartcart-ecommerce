<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product — SmartCart</title>
  <meta name="description" content="Product details, pricing and availability at SmartCart.">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <script src="js/theme-init.js"></script>
  <script type="module" src="js/pages/product.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div id="product-root" class="product-detail">
      <div class="skeleton product-detail__media"></div>
      <div>
        <div class="skeleton" style="height: 2.5rem; margin-bottom: 16px"></div>
        <div class="skeleton" style="height: 8rem"></div>
      </div>
    </div>

    <section class="section" id="related" hidden>
      <div class="section__head"><h2>You may also like</h2></div>
      <div class="product-grid" id="related-grid"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
